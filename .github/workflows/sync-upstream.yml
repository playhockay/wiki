name: Sync fork with upstream

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC, 30 minutes before the belt update
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hockay-belt   # same group as the belt workflow, so they never overlap
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into this fork
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" \
            -f branch="$GITHUB_REF_NAME"
